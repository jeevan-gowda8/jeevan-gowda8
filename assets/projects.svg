="474" class="sans" font-size="15.5" fill="#8b949e">Flutter and web dashboard to monitor and control campus street</text><text x="68.0" y="498" class="sans" font-size="15.5" fill="#8b949e">lights and connected devices in real time.</text><rect x="68.0" y="528" width="80" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="108.0" y="546.55" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">Flutter</text><rect x="156.0" y="528" width="88" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="200.0" y="546.55" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">HTML/CSS</text><rect x="252.0" y="528" width="88" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="296.0" y="546.55" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">REST API</text></g><g><rect x="610.0" y="364" width="550.0" height="214" rx="16" fill="#161b22" stroke="#30363d"/><rect x="610.0" y="388" width="3" height="40" rx="1.5" fill="#58a6ff"/><text x="638.0" y="402" class="mono" font-size="12" letter-spacing="2" fill="#58a6ff">COMPUTER VISION</text><text x="638.0" y="440" class="sans" font-size="24" font-weight="700" fill="#e6edf3">Smart Attendance System</text><text x="638.0" y="474" class="sans" font-size="15.5" fill="#8b949e">Face-recognition based system that marks attendance</text><text x="638.0" y="498" class="sans" font-size="15.5" fill="#8b949e">automatically, built on OpenCV and Flask.</text><rect x="638.0" y="528" width="72" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="674.0" y="546.55" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">OpenCV</text><rect x="718.0" y="528" width="80" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="758.0" y="546.55" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">FaceNet</text><rect x="806.0" y="528" width="64" height="28" rx="14.0" fill="#0d1117" stroke="#30363d"/><text x="838.0" y="546.55" text-anchor="middle" class="mono"