<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-label="Let's connect"><title>Let's connect</title><defs></defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.glow{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.fade{opacity:0;animation:fade .8s ease-out forwards}
@keyframes fade{to{opacity:1}}
</style>
<rect width="1200" height="128" rx="20" fill="#0d1117"/><rect x=".5" y=".5" width="1199" height="127" rx="19.5" fill="none" stroke="#30363d"/><text x="40" y="50" class="mono" font-size="13" letter-spacing="3" fill="#58a6ff">05 / CONTACT</text><text x="40" y="88" class="sans" font-size="30" font-weight="700" fill="#e6edf3">Let's connect</text><rect x="40" y="104" width="56" height="3" rx="1.5" fill="#58a6ff"/><text x="1160" y="88" text-anchor="end" class="sans" font-size="15" fill="#8b949e">Reach out by email or Instagram</text></svg>