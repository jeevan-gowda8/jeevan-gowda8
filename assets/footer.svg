<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img" aria-label="Building practical AI systems that work in real applications."><title>Building practical AI systems that work in real applications.</title><defs></defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.glow{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.fade{opacity:0;animation:fade .8s ease-out forwards}
@keyframes fade{to{opacity:1}}
</style>
<rect width="1200" height="130" rx="20" fill="#0d1117"/><rect x=".5" y=".5" width="1199" height="129" rx="19.5" fill="none" stroke="#30363d"/><rect x="420" y="30" width="360" height="2" rx="1" fill="#58a6ff" class="glow"/><text x="600" y="76" text-anchor="middle" class="sans" font-size="22" font-weight="600" fill="#e6edf3">Building practical AI systems that work in real applications.</text><text x="600" y="106" text-anchor="middle" class="mono" font-size="13" letter-spacing="2" fill="#8b949e">THANKS FOR VISITING</text></svg>